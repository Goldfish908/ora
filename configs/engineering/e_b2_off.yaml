# E-B2-off: E-B2 (workers + E2.1 triggers) with actor thinking OFF.
# Purpose: the E2.1 pre_finish_open_findings bounce only matters when audits
# exist; E-B1-off has workers disabled so rule C can never fire there. This
# arm is the mode-consistent test of trigger benefit under thinking-off
# (taskbook v1.1 §E4 requirement), on the internal endpoint.

job_name: e_b2_off
jobs_dir: runs/engineering
n_attempts: 1
timeout_multiplier: 1.0
debug: false
quiet: false

orchestrator:
  type: local
  n_concurrent_trials: 6

retry:
  max_retries: 0
  include_exceptions: null
  exclude_exceptions:
    - VerifierTimeoutError
    - AgentTimeoutError
  wait_multiplier: 1.0
  min_wait_sec: 1
  max_wait_sec: 60

environment:
  type: docker
  import_path: null
  force_build: false
  delete: true
  override_cpus: null
  override_memory_mb: null
  override_storage_mb: null
  override_gpus: null
  kwargs: {}

verifier:
  override_timeout_sec: null
  max_timeout_sec: null
  disable: false

agents:
  - name: null
    import_path: ora_agent.harbor_agent:OrAgent
    model_name: Qwen3_8-27B
    n_concurrent: 6
    override_timeout_sec: null
    override_setup_timeout_sec: null
    max_timeout_sec: null
    env:
      ORA_LLM_BASE_URL: "${ORA_LLM_BASE_URL}"
      ORA_LLM_API_KEY: "${ORA_LLM_API_KEY}"
      ORA_LLM_MODEL: "${ORA_LLM_MODEL}"
    kwargs:
      max_steps: 40
      token_budget: 1200000
      temperature: 0.6
      max_tokens: 8192
      exec_timeout_sec: 360
      predict_mode: "off"
      enable_workers: true
      enable_triggers: true
      # Internal vLLM: thinking off ONLY works nested (top-level silently
      # ignored, measured 2026-10-29).
      actor_llm_extra:
        chat_template_kwargs:
          enable_thinking: false
      worker_llm_extra:
        chat_template_kwargs:
          enable_thinking: false

datasets:
  - path: ORAgentBench/harbor_tasks
    task_names:
      - airport_gate_assignment
      - carbon_aware_compute_scheduling
      - bike_share_rebalancing
      - cell_tower_coverage_expansion
      - circular_packaging_replenishment
      - dynamic_supply_disruption_replanning
    exclude_task_names: null

tasks: []
artifacts: []
